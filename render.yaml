
services:
  - type: web
    name: navalshore-nn-portal
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    envVars:
      - key: PORT
        value: "10000"

      - key: SECURE_COOKIE
        value: "true"

      - key: REGISTRATION_OPEN
        value: "true"

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: DATABASE_HOST
        sync: false

      - key: DATABASE_NAME
        sync: false

      - key: SPRING_DATASOURCE_USERNAME
        sync: false

      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
